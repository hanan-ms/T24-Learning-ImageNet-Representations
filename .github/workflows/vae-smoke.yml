name: VAE CPU smoke tests

on:
  push:
    paths:
      - 'vae.py'
      - 'train_vae.py'
      - 'run_vae_study.py'
      - 'tests/**'
      - '.github/workflows/vae-smoke.yml'
  pull_request:
    paths:
      - 'vae.py'
      - 'run_vae_study.py'
      - 'tests/**'
  workflow_dispatch:

jobs:
  smoke:
    name: Model shapes, loss and 1-epoch synthetic study
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-test.txt'
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify imports and run tests
        run: |
          python -m compileall -q vae.py train_vae.py run_vae_study.py plot_vae_study.py tests/
          python -m unittest discover -s tests -v
