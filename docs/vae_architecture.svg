<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="515" viewBox="0 0 1160 515" role="img" aria-label="Convolutional VAE architecture with encoder, reparameterization, and decoder"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.name{font-size:15px;font-weight:bold}.dim{font-size:14px}.heading{font-size:27px;font-weight:bold}.small{font-size:13px;fill:#475569}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker></defs><rect width="1160" height="515" fill="#fff"/><text x="28" y="46" class="heading">T24 Convolutional VAE — Encoder, Sampling, Decoder</text><text x="28" y="77" class="small">All convolutions and transposed convolutions use kernel 4, stride 2, padding 1; dimensions show C × H × W.</text><rect x="26" y="102" width="135" height="70" rx="10" fill="#dbeafe" stroke="#9ba8b6"/><text x="93.5" y="130" text-anchor="middle" class="name">Input image</text><text x="93.5" y="153" text-anchor="middle" class="dim">3 × 64 × 64</text><rect x="187" y="102" width="130" height="70" rx="10" fill="#c7ede2" stroke="#9ba8b6"/><text x="252" y="130" text-anchor="middle" class="name">Conv + ReLU</text><text x="252" y="153" text-anchor="middle" class="dim">32 × 32 × 32</text><rect x="344" y="102" width="130" height="70" rx="10" fill="#c7ede2" stroke="#9ba8b6"/><text x="409" y="130" text-anchor="middle" class="name">Conv + ReLU</text><text x="409" y="153" text-anchor="middle" class="dim">64 × 16 × 16</text><rect x="501" y="102" width="130" height="70" rx="10" fill="#c7ede2" stroke="#9ba8b6"/><text x="566" y="130" text-anchor="middle" class="name">Conv + ReLU</text><text x="566" y="153" text-anchor="middle" class="dim">128 × 8 × 8</text><rect x="658" y="102" width="130" height="70" rx="10" fill="#c7ede2" stroke="#9ba8b6"/><text x="723" y="130" text-anchor="middle" class="name">Conv + ReLU</text><text x="723" y="153" text-anchor="middle" class="dim">256 × 4 × 4</text><rect x="815" y="102" width="150" height="70" rx="10" fill="#fee8b8" stroke="#9ba8b6"/><text x="890" y="130" text-anchor="middle" class="name">Flatten + FC</text><text x="890" y="153" text-anchor="middle" class="dim">μ and log σ²</text><rect x="990" y="102" width="125" height="70" rx="10" fill="#fbcde6" stroke="#9ba8b6"/><text x="1052.5" y="130" text-anchor="middle" class="name">Sample z</text><text x="1052.5" y="153" text-anchor="middle" class="dim">Latent L</text><path d="M 167 137 H 179" stroke="#475569" stroke-width="2" marker-end="url(#arr)" fill="none"/><path d="M 323 137 H 336" stroke="#475569" stroke-width="2" marker-end="url(#arr)" fill="none"/><path d="M 480 137 H 493" stroke="#475569" stroke-width="2" marker-end="url(#arr)" fill="none"/><path d="M 637 137 H 650" stroke="#475569" stroke-width="2" marker-end="url(#arr)" fill="none"/><path d="M 794 137 H 807" stroke="#475569" stroke-width="2" marker-end="url(#arr)" fill="none"/><path d="M 971 137 H 982" stroke="#475569" stroke-width="2" marker-end="url(#arr)" fill="none"/><path d="M 1052 184 V 324" stroke="#475569" stroke-width="2" marker-end="url(#arr)" fill="none"/><text x="1070" y="238" class="small">z = μ + σ·ε</text><text x="1070" y="256" class="small">ε ~ N(0,I)</text><rect x="990" y="338" width="125" height="70" rx="10" fill="#dbeafe" stroke="#9ba8b6"/><text x="1052.5" y="366" text-anchor="middle" class="name">FC + Reshape</text><text x="1052.5" y="389" text-anchor="middle" class="dim">256 × 4 × 4</text><rect x="815" y="338" width="150" height="70" rx="10" fill="#c7ede2" stroke="#9ba8b6"/><text x="890" y="366" text-anchor="middle" class="name">Deconv + ReLU</text><text x="890" y="389" text-anchor="middle" class="dim">128 × 8 × 8</text><rect x="658" y="338" width="130" height="70" rx="10" fill="#c7ede2" stroke="#9ba8b6"/><text x="723" y="366" text-anchor="middle" class="name">Deconv + ReLU</text><text x="723" y="389" text-anchor="middle" class="dim">64 × 16 × 16</text><rect x="501" y="338" width="130" height="70" rx="10" fill="#c7ede2" stroke="#9ba8b6"/><text x="566" y="366" text-anchor="middle" class="name">Deconv + ReLU</text><text x="566" y="389" text-anchor="middle" class="dim">32 × 32 × 32</text><rect x="344" y="338" width="130" height="70" rx="10" fill="#dbeafe" stroke="#9ba8b6"/><text x="409" y="366" text-anchor="middle" class="name">Deconv + Sigmoid</text><text x="409" y="389" text-anchor="middle" class="dim">3 × 64 × 64</text><path d="M 984 373 H 973" stroke="#475569" stroke-width="2" marker-end="url(#arr)" fill="none"/><path d="M 809 373 H 796" stroke="#475569" stroke-width="2" marker-end="url(#arr)" fill="none"/><path d="M 652 373 H 639" stroke="#475569" stroke-width="2" marker-end="url(#arr)" fill="none"/><path d="M 495 373 H 482" stroke="#475569" stroke-width="2" marker-end="url(#arr)" fill="none"/><text x="28" y="135" class="heading" style="font-size:18px">Encoder →</text><text x="28" y="370" class="heading" style="font-size:18px">← Decoder</text><text x="28" y="468" class="small">L = 32 (E2), 64 (E1/E4/E5/E6), 128 (E3). Separate FC heads produce μ and log σ². Decoder final Sigmoid constrains pixels to [0, 1].</text><text x="28" y="492" class="small">Input: 64×64 RGB. Output: 64×64 RGB. Diagram derived directly from vae.py.</text></svg>
